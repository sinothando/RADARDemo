{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Change password</h1>
    <p class="small-muted">At least 10 characters, with an uppercase letter, a lowercase letter, and a number.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="current_password">Current password</label>
        <input class="form-control" id="current_password" name="current_password" type="password" required autocomplete="current-password"></div>
      <div class="mb-3"><label class="form-label" for="new_password">New password</label>
        <input class="form-control" id="new_password" name="new_password" type="password" required autocomplete="new-password"></div>
      <div class="mb-3"><label class="form-label" for="confirm_password">Confirm new password</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit">Save password</button>
      <a class="btn btn-link" href="{{ url_for('records.dashboard') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
