{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">RADAR sign in</h1>
    <p class="small-muted mb-4">For authorised university staff only.</p>
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">Institutional email</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email }}" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
